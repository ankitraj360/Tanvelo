<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none" class="tanvelo-mark">
  <defs>
    <linearGradient id="tanvelo-grad" x1="15%" y1="0%" x2="85%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>
    <radialGradient id="spark-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="40%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0" />
    </radialGradient>
    <filter id="core-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <!-- Three convergence ribbon blades -->
  <path d="M 61.47 41.97 L 84.44 33.94 A 38.00 38.00 0 0 1 66.06 84.44 L 58.81 60.88 A 14.00 14.00 0 0 0 61.47 41.97 Z" fill="url(#tanvelo-grad)" fill-opacity="0.95" />
  <path d="M 51.22 63.95 L 46.69 87.86 A 38.00 38.00 0 0 1 12.14 46.69 L 36.17 52.19 A 14.00 14.00 0 0 0 51.22 63.95 Z" fill="url(#tanvelo-grad)" fill-opacity="0.88" />
  <path d="M 37.31 44.08 L 18.87 28.20 A 38.00 38.00 0 0 1 71.80 18.87 L 55.02 36.93 A 14.00 14.00 0 0 0 37.31 44.08 Z" fill="url(#tanvelo-grad)" fill-opacity="0.80" />
  <!-- Central gateway spark -->
  <circle cx="50" cy="50" r="4.5" fill="#E0F2FE" filter="url(#core-glow)" />
  <circle cx="50" cy="50" r="2.2" fill="#FFFFFF" />
</svg>