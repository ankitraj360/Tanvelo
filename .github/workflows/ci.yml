name: CI & Production Gates

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-build:
    name: Clean Build & Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client and build database package
        run: pnpm --filter @tanvelo/db generate && pnpm --filter @tanvelo/db build

      - name: Clean stale .next cache
        run: rm -rf apps/web/.next

      - name: Build all packages and applications
        run: pnpm build

      - name: Typecheck Next.js
        run: pnpm --filter @tanvelo/web lint

  test-suite:
    name: Ephemeral DB & Redis Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: test_tanvelo
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      DATABASE_URL: "postgresql://test_user:test_password@localhost:5432/test_tanvelo"
      DIRECT_URL: "postgresql://test_user:test_password@localhost:5432/test_tanvelo"
      TEST_DATABASE_URL: "postgresql://test_user:test_password@localhost:5432/test_tanvelo"
      REDIS_URL: "redis://localhost:6379"
      ENCRYPTION_SECRET: "ci0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
      MANAGEMENT_API_SECRET: "ci_test_management_secret_minimum_32_chars_long_0123456789"

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client and build database package
        run: pnpm --filter @tanvelo/db generate && pnpm --filter @tanvelo/db build

      - name: Run Prisma migrations on fresh database
        run: pnpm db:migrate:deploy

      - name: Seed test database catalog
        run: pnpm db:seed

      - name: Build core and gateway
        run: pnpm --filter @tanvelo/core build && pnpm --filter @tanvelo/gateway build

      - name: Run complete test suite
        run: pnpm test

      - name: Verify @tanvelo/sdk packaging & tarball installation
        run: |
          pnpm --filter @tanvelo/sdk build
          cd packages/sdk
          TARBALL=$(npm pack)
          mkdir -p /tmp/sdk-smoke && cd /tmp/sdk-smoke
          npm init -y
          npm install "${GITHUB_WORKSPACE}/packages/sdk/${TARBALL}"
          node -e "const { TanveloClient } = require('@tanvelo/sdk'); const client = new TanveloClient({ apiKey: 'tan_test' }); console.log('SDK smoke test passed:', typeof client.chat.completions.create);"

  docker-verification:
    name: Docker Image Build Verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Gateway Docker image
        run: docker build -f apps/gateway/Dockerfile -t tanvelo-gateway:ci .

      - name: Build Web Docker image
        run: docker build -f apps/web/Dockerfile -t tanvelo-web:ci .
