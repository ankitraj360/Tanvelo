name: CI & Production Gates

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-build:
    name: Clean Build & Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false

      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @tanvelo/db generate

      - name: Clean stale .next cache
        run: rm -rf apps/web/.next

      - name: Build all packages and applications
        run: pnpm build

      - name: Lint Next.js
        run: pnpm --filter @tanvelo/web lint

  test-suite:
    name: Ephemeral DB & Redis Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: test_tanvelo
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      DATABASE_URL: "postgresql://test_user:test_password@localhost:5432/test_tanvelo"
      TEST_DATABASE_URL: "postgresql://test_user:test_password@localhost:5432/test_tanvelo"
      REDIS_URL: "redis://localhost:6379"
      ENCRYPTION_SECRET: "e98b0f71923fa53df7ceae650630ba1ef1ec55152eb9b8f2bf29a8a7ca208359"
      MANAGEMENT_API_SECRET: "c8e6f1a4d9b2e7c3a0f5d8b1e4c7a2f9c8e6f1a4d9b2e7c3a0f5d8b1e4c7a2f9"

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @tanvelo/db generate

      - name: Run Prisma migrations on fresh database
        run: pnpm db:migrate:deploy

      - name: Seed test database catalog
        run: pnpm db:seed

      - name: Build core and gateway
        run: pnpm --filter @tanvelo/core build && pnpm --filter @tanvelo/gateway build

      - name: Run complete test suite
        run: pnpm test

  docker-verification:
    name: Docker Image Build Verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Gateway Docker image
        run: docker build -f apps/gateway/Dockerfile -t tanvelo-gateway:ci .

      - name: Build Web Docker image
        run: docker build -f apps/web/Dockerfile -t tanvelo-web:ci .
